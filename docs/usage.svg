<svg xmlns="http://www.w3.org/2000/svg" width="912" height="540" viewBox="0 0 912 540" role="img" aria-label="The row of shortcuts, then what a press on AFK asks, in a terminal">
<title>The row of shortcuts, then what a press on AFK asks, in a terminal</title>
<rect width="912" height="222" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<rect y="238" width="912" height="302" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="256" r="5" fill="#f38ba8"/><circle cx="38" cy="256" r="5" fill="#f9e2af"/><circle cx="56" cy="256" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="18.0" y="56" fill="#7f849c">❯ The plan: add a parser test and a README to this empty folder. Don&#x27;t start yet. Reply with ok.</text>
<text x="18.0" y="98" fill="#cdd6f4">⏺ ok</text>
<text x="18.0" y="140" fill="#cdd6f4">Challenge this <tspan fill="#7f849c">│</tspan> Agent council <tspan fill="#7f849c">│</tspan> Serve a new session <tspan fill="#7f849c">│</tspan> AFK <tspan fill="#7f849c">│</tspan> Wrap up</text>
<rect x="18.0" y="158" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="184" fill="#7f849c">❯</text>
<rect x="18.0" y="200" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="294" fill="#7f849c">☐ Shortcuts</text>
<text x="18.0" y="336" fill="#cdd6f4">You are walking away. What should Claude work on?</text>
<text x="18.0" y="378" fill="#cdd6f4">❯ 1. Write the planned README for the demo project.</text>
<text x="18.0" y="399" fill="#cdd6f4">  2. Add the planned parser test for the demo project.</text>
<text x="18.0" y="420" fill="#cdd6f4">  3. Cancel</text>
<text x="18.0" y="441" fill="#cdd6f4">  4. Type something.</text>
<rect x="18.0" y="458" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="484" fill="#cdd6f4">  5. Chat about this</text>
<text x="18.0" y="520" fill="#7f849c">Enter to select · ↑/↓ to navigate · Esc to cancel</text>
</g>
</svg>
